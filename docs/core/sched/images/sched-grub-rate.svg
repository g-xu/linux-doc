<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
  <title id="title">GRUB模型中预算扣减速度变化</title>
  <desc id="desc">T2在t2开始执行，q从4到t4的2，之后回收T1 inactive带宽，扣减系数由1变0.5，到t8才用完剩2。图假定Q4 P8 Ui0.5 Umax1 Uextra0。</desc>
  <rect width="1100" height="510" fill="#fff"/>
  <g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#20252b">
    <text x="30" y="40" font-size="23">物理执行仍推进，预算在0-lag之后扣得更慢</text>
    <text x="30" y="84" font-size="18">独立模型：T1/T2各Q=4、D=P=8 ms；Umax=1，Uextra=0，非设备默认参数</text>
    <path d="M180 130 V360 H950" stroke="#7b8793" fill="none"/>
    <path d="M180 160 H900 M180 260 H900" stroke="#d1d7dd" stroke-dasharray="4 4"/>
    <polyline points="180,160 420,260 900,360" fill="none" stroke="#338768" stroke-width="4"/>
    <path d="M420 120 V360" stroke="#a84d68" stroke-dasharray="5 5"/>
    <g font-size="18">
      <text x="50" y="165">T2 q=4</text><text x="50" y="265">q=2</text><text x="50" y="365">q=0</text>
      <text x="175" y="397">t=2</text><text x="400" y="397">t=4</text><text x="875" y="397">t=8 ms</text>
      <text x="225" y="205">扣减系数1</text><text x="550" y="285">扣减系数0.5</text>
      <text x="438" y="137">T1到0-lag，转Inactive</text>
    </g>
    <text x="30" y="453" font-size="19">前2 ms物理执行扣2 ms预算；后4 ms物理执行再扣2 ms预算。</text>
    <text x="30" y="491" font-size="17">回收改变预算消耗速率，不把T1的剩余预算字段直接复制给T2。</text>
  </g>
</svg>
