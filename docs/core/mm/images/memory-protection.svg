<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
  <title id="title">memory.low 的配置量与有效保护量</title>
  <desc id="desc">简化父级有效 low 六 GiB，两个子组配置 low 四 GiB 且各用四 GiB，需求超过父级，每组按使用量分得三 GiB 有效保护。Low 是尽力保护，不是预分配 RAM。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#475569"/></marker></defs>
  <rect width="960" height="350" fill="#fff"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#17202a" text-anchor="middle">
    <rect x="250" y="20" width="460" height="73" rx="4" fill="#f3e8ff" stroke="#7e22ce"/>
    <text x="480" y="51" font-size="21">非 root 父级：有效 low 6 GiB</text><text x="480" y="79" font-size="16">假设只分配给下方两组，父级没有其他用量</text>
    <path d="M480 93V117H250V144M480 117H710V144" stroke="#475569" fill="none" marker-end="url(#a)"/>
    <rect x="80" y="156" width="340" height="122" rx="4" fill="#ccfbf1" stroke="#0f766e"/>
    <rect x="540" y="156" width="340" height="122" rx="4" fill="#ccfbf1" stroke="#0f766e"/>
    <g font-size="20"><text x="250" y="188">子组 A</text><text x="710" y="188">子组 B</text></g>
    <g font-size="17"><text x="250" y="220">配置 low 4 GiB，用量 4 GiB</text><text x="710" y="220">配置 low 4 GiB，用量 4 GiB</text><text x="250" y="252">有效 low：6 × 4 / 8 = 3 GiB</text><text x="710" y="252">有效 low：6 × 4 / 8 = 3 GiB</text></g>
    <text x="480" y="314" font-size="17">保护影响回收选择，不预分配 RAM；low 条件下仍可能被回收</text>
    <text x="480" y="340" font-size="15">教学模型省略其他祖先、层级选项和计数漂移；不是某台机器的配额实测</text>
  </g>
</svg>
