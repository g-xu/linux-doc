<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">分配归属与 section 管理是不同视图</title>
  <desc id="desc">同一 node 和 zone 中的两组页分别位于 section 8 和 9。实线表示归属，虚线表示 section 覆盖的 PFN 范围。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#475569"/></marker></defs>
  <rect width="960" height="330" fill="#fff"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#17202a" text-anchor="middle">
    <g font-size="19"><text x="148" y="32">分配归属</text><text x="480" y="32">同一批物理页</text><text x="812" y="32">稀疏描述管理</text></g>
    <rect x="24" y="116" width="248" height="103" rx="4" fill="#f3e8ff" stroke="#7e22ce"/>
    <text x="148" y="153" font-size="21">node 0</text><text x="148" y="187" font-size="20">ZONE_DMA32</text>
    <rect x="360" y="76" width="240" height="82" rx="4" fill="#fef3c7" stroke="#b45309"/>
    <rect x="360" y="204" width="240" height="82" rx="4" fill="#fef3c7" stroke="#b45309"/>
    <g font-size="17"><text x="480" y="104">第一组页：128 MiB</text><text x="480" y="232">第二组页：128 MiB</text></g>
    <g font-size="14"><text x="480" y="136">0x40000000 到 0x48000000</text><text x="480" y="264">0x48000000 到 0x50000000</text></g>
    <rect x="688" y="76" width="248" height="82" rx="4" fill="#ccfbf1" stroke="#0f766e"/>
    <rect x="688" y="204" width="248" height="82" rx="4" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="812" y="112" font-size="21">section 8</text><text x="812" y="240" font-size="21">section 9</text>
    <text x="812" y="140" font-size="16">物理地址右移 27 位</text><text x="812" y="268" font-size="16">物理地址右移 27 位</text>
    <path d="M272 151H314V117H352M272 184H314V245H352" stroke="#475569" fill="none" marker-end="url(#a)"/>
    <path d="M688 117H608M688 245H608" stroke="#475569" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/>
    <text x="480" y="315" font-size="16">实线：这些页属于此 zone；虚线：section 覆盖这些 PFN 的地址范围</text>
  </g>
</svg>
