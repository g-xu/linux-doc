<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
  <title id="title">内存管理主要功能与协作地图</title>
  <desc id="desc">物理资源经页分配提供给内核对象、缺页和页缓存；地址空间把访问需求交给缺页；回收、交换、迁移、规整调整资源，生命周期与记账约束各路径。</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52616c"/></marker>
    <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#24323c;font-size:20px}.h{font-size:26px;font-weight:700}.s{font-size:17px;fill:#455561}.n{stroke:#b9c8d0;stroke-width:1.5;rx:6}.e{fill:none;stroke:#52616c;stroke-width:2;marker-end:url(#a)}.d{fill:none;stroke:#8d6674;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#a)}</style>
  </defs>
  <rect width="1120" height="790" fill="#fff"/>
  <text x="35" y="36" class="h">同一资源，由不同机制管理供给、访问和调整</text>
  <rect x="35" y="75" width="280" height="92" class="n" fill="#e5f1ec"/>
  <text x="175" y="112" text-anchor="middle">物理内存组织与初始化</text>
  <text x="175" y="143" text-anchor="middle" class="s">RAM / Node / Zone / 描述符</text>
  <rect x="420" y="75" width="280" height="92" class="n" fill="#e8f0fa"/>
  <text x="560" y="112" text-anchor="middle">进程地址空间</text>
  <text x="560" y="143" text-anchor="middle" class="s">范围 / 权限 / 数据来源</text>
  <rect x="805" y="75" width="280" height="92" class="n" fill="#fff1dc"/>
  <text x="945" y="112" text-anchor="middle">内核对象与虚拟空间</text>
  <text x="945" y="143" text-anchor="middle" class="s">slab / kmalloc / vmalloc</text>
  <path d="M175 167V265" class="e"/>
  <text x="190" y="194" class="s">移交可用页</text>
  <path d="M560 167V265" class="e"/>
  <text x="575" y="193" class="s">访问触发 / 合法性判断</text>
  <path d="M805 105H750V215H285V265" class="e"/>
  <text x="353" y="207" class="s">需要后备物理页</text>
  <rect x="35" y="270" width="280" height="104" class="n" fill="#e5f1ec"/>
  <text x="175" y="309" text-anchor="middle">物理页分配</text>
  <text x="175" y="342" text-anchor="middle" class="s">Buddy / PCP / GFP / 水位</text>
  <rect x="420" y="270" width="280" height="104" class="n" fill="#e8f0fa"/>
  <text x="560" y="309" text-anchor="middle">缺页与映射维护</text>
  <text x="560" y="342" text-anchor="middle" class="s">匿名 / 文件 / COW / 页表</text>
  <path d="M315 322H420" class="e"/>
  <text x="322" y="296" class="s">供给页</text>
  <rect x="805" y="270" width="280" height="104" class="n" fill="#fff1dc"/>
  <text x="945" y="309" text-anchor="middle">回收 / 交换 / 规整</text>
  <text x="945" y="342" text-anchor="middle" class="s">驻留选择 / 后备 / 位置调整</text>
  <path d="M315 363H365V408H945V374" class="e"/>
  <text x="600" y="398" class="s">适用路径引入压力</text>
  <path d="M805 292H765V245H55V270" class="e"/>
  <text x="330" y="238" class="s">释放资源 / 改善连续性</text>
  <rect x="35" y="475" width="280" height="104" class="n" fill="#e5f1ec"/>
  <text x="175" y="515" text-anchor="middle">匿名数据与物理页</text>
  <text x="175" y="547" text-anchor="middle" class="s">引用 / 映射 / 当前位置</text>
  <path d="M175 374V475" class="e"/>
  <text x="160" y="444" class="s" text-anchor="end">成为使用中的页</text>
  <rect x="420" y="475" width="280" height="104" class="n" fill="#e8f0fa"/>
  <text x="560" y="515" text-anchor="middle">文件页缓存与回写</text>
  <text x="560" y="547" text-anchor="middle" class="s">文件偏移 / 数据就绪 / 脏状态</text>
  <path d="M540 374V475" class="e"/>
  <text x="554" y="452" class="s">定位文件数据</text>
  <path d="M420 515H355V395H285V374" class="e"/>
  <text x="346" y="465" class="s" text-anchor="end">请求缓存页</text>
  <rect x="805" y="475" width="280" height="104" class="n" fill="#f2f5f7"/>
  <text x="945" y="515" text-anchor="middle">文件系统 / 交换后备</text>
  <text x="945" y="547" text-anchor="middle" class="s">重新取得或保存数据</text>
  <path d="M700 526H805" class="e"/>
  <text x="712" y="504" class="s">数据 I/O</text>
  <path d="M945 374V475" class="e"/>
  <text x="959" y="451" class="s">需要后备时</text>
  <rect x="35" y="665" width="1050" height="82" rx="6" fill="#f8edf0" stroke="#c59ca8" stroke-width="1.5"/>
  <text x="560" y="699" text-anchor="middle">贯穿约束：生命周期与 rmap · 同步与 TLB · memcg · NUMA 与执行上下文</text>
  <text x="560" y="730" text-anchor="middle" class="s">约束谁可分配、谁可访问、谁能回收或移动，以及资源归属和操作时机</text>
  <path d="M175 665V579" class="d"/>
  <path d="M560 665V579" class="d"/>
  <path d="M945 665V579" class="d"/>
  <text x="35" y="775" class="s">实线：主要需求或资源关系。虚线：贯穿条件。为可读性省略次要交接与失败分支。</text>
</svg>
