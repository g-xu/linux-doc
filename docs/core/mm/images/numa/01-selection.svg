<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">NUMA四种位置状态</title><desc id="desc">任务在N0执行，普通允许N0N1，任务BIND N1。VMA DEFAULT回退任务BIND，显式LOCAL用本地偏好，但已有N1页不自动移动。最终分配仍检查zone供给及收费。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Microsoft YaHei",sans-serif;font-size:18px;fill:#17232b;letter-spacing:0}.h{font-size:23px;font-weight:700}.s{font-size:16px}.b{stroke:#71838b;stroke-width:1.5;rx:5}.ar{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}</style>
<rect width="960" height="470" fill="#fff"/><text x="28" y="40" class="h">CPU在哪里、允许哪里、偏好哪里、页在哪里分别判断</text>
<rect x="40" y="90" width="880" height="70" fill="#eef1f4" class="b"/><text x="62" y="121">逻辑模型：CPU在N0，允许{N0,N1}，任务策略BIND到N1</text><text x="62" y="150" class="s">共享/范围策略优先，未给出再回退任务/默认</text>
<path class="ar" d="M480 160V193H235V235"/><path class="ar" d="M480 193H725V235"/>
<rect x="40" y="235" width="390" height="105" fill="#eaf1fb" class="b"/><text x="62" y="270">VMA DEFAULT</text><text x="62" y="304">继承适用任务BIND → N1</text><text x="62" y="331" class="s">不是自动清所有层策略</text>
<rect x="530" y="235" width="390" height="105" fill="#e6f4ef" class="b"/><text x="552" y="270">VMA显式LOCAL</text><text x="552" y="304">改变本层偏好 → 本地优先</text><text x="552" y="331" class="s">仍受允许范围/zone/供给约束</text>
<text x="40" y="393">旧页已在N1，设置新策略不自动移到N0；需独立迁移协议。</text>
<text x="40" y="443" class="s">此为普通用户新分配模型，不是目标拓扑或所有低zone/共享文件后备的统一规则。</text>
</svg>
