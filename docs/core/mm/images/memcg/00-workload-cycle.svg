<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
<title id="title">工作负载共享RAM与匿名页收费周期</title>
<desc id="desc">工作负载A和B使用同一物理供给，memcg按资源归属控制消耗而非划分专属PFN。选A中任务正常匿名首次写：准备物理P，完成适用组及祖先收费，重检后建立PTE，继续使用，最终寿命结束才uncharge并归还存储。图不表示每次访问收费或一次解除映射立即释放。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Microsoft YaHei",sans-serif;font-size:18px;fill:#17232b;letter-spacing:0}.h{font-size:23px;font-weight:700}.s{font-size:16px}.b{stroke:#71838b;stroke-width:1.5;rx:5}.ar{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}</style>
<rect width="960" height="550" fill="#fff"/>
<text x="28" y="40" class="h">不是切分RAM，而是给消耗建立归属与政策</text>
<rect x="70" y="83" width="330" height="75" class="b" fill="#eaf1fb"/><text x="92" y="115">工作负载A</text><text x="92" y="143" class="s">适用消耗计入A及祖先</text>
<rect x="560" y="83" width="330" height="75" class="b" fill="#f9eaf0"/><text x="582" y="115">工作负载B</text><text x="582" y="143" class="s">有自己的限额与保护</text>
<path class="ar" d="M235 158V188H350V210"/><path class="ar" d="M725 158V188H610V210"/>
<rect x="220" y="210" width="520" height="65" class="b" fill="#e6f4ef"/><text x="242" y="250">共同使用物理RAM供给，不是各自专属页池</text>
<text x="40" y="322">选A中任务的一次普通匿名首次写，正常成功路径：</text>
<rect x="40" y="353" width="156" height="90" class="b" fill="#eaf1fb"/><text x="58" y="386">准备P</text><text x="58" y="419" class="s">取得物理后备</text>
<rect x="220" y="353" width="156" height="90" class="b" fill="#fff0e7"/><text x="238" y="386">收费给A</text><text x="238" y="419" class="s">额度与关联</text>
<rect x="400" y="353" width="156" height="90" class="b" fill="#e6f4ef"/><text x="418" y="386">重检并交付</text><text x="418" y="419" class="s">建立PTE等关系</text>
<rect x="580" y="353" width="156" height="90" class="b" fill="#eaf1fb"/><text x="598" y="386">继续使用P</text><text x="598" y="419" class="s">不是每次访问收费</text>
<rect x="760" y="353" width="156" height="90" class="b" fill="#f9eaf0"/><text x="778" y="386">最终结束寿命</text><text x="778" y="419" class="s">uncharge及归还</text>
<path class="ar" d="M196 398H220"/><path class="ar" d="M376 398H400"/><path class="ar" d="M556 398H580"/><path class="ar" d="M736 398H760"/>
<text x="40" y="485">收费失败或未能发布P，调用路径清理本次未交付资源。</text>
<text x="40" y="522" class="s">忽略stock/并发/特权；一次munmap不保证后备寿命结束；其他来源收费时机另核。</text>
</svg>
