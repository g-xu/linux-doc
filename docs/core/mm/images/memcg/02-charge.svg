<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">收费尝试失败不等最终失败</title><desc id="desc">子94父98两层max100申请4，子98父102失败取消回94/98。允许内部回收后父96重试成功到98/100并绑定准备页，最终失败才清准备资源。内部失败不先释放仍需交付的页。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Microsoft YaHei",sans-serif;font-size:18px;fill:#17232b;letter-spacing:0}.h{font-size:23px;font-weight:700}.s{font-size:16px}.b{stroke:#71838b;stroke-width:1.5;rx:5}.ar{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}</style>
<rect width="960" height="560" fill="#fff"/><text x="28" y="40" class="h">计数取消、内部回收重试、准备页归还分属不同阶段</text>
<rect x="40" y="85" width="880" height="75" fill="#eaf1fb" class="b"/><text x="62" y="116">准备资源尚由调用者持有；子94 / 父98，max各100，请求4</text><text x="62" y="148" class="s">忽略stock/并发，已缩小到实际规模，不走特权force</text>
<path class="ar" d="M480 160V195"/>
<rect x="40" y="195" width="880" height="75" fill="#f9eaf0" class="b"/><text x="62" y="226">子98通过 → 父102失败 → 取消本轮父/子变化，回94/98</text><text x="62" y="258" class="s">一次层次计数失败，不意味着charge整体已返回错误</text>
<path class="ar" d="M480 270V306H235V350"/><path class="ar" d="M480 306H725V350"/>
<rect x="40" y="350" width="390" height="120" fill="#e6f4ef" class="b"/><text x="62" y="384">允许内部回收：父变96</text><text x="62" y="418">重试成功：子98 / 父100</text><text x="62" y="452" class="s">绑定资源；最终释放才uncharge</text>
<rect x="530" y="350" width="390" height="120" fill="#fff0e7" class="b"/><text x="552" y="384">最终charge返回失败</text><text x="552" y="418">调用者清未交付资源</text><text x="552" y="452" class="s">不是中间重试前先丢准备页</text>
<text x="40" y="527" class="s">这里是4页计数请求模型，不声称每次基本页fault都会以4页粒度进行收费。</text>
</svg>
