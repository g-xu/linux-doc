<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">MGLRU序列与循环数组下标</title>
  <desc id="desc">四个下标0到3分别保存逻辑seq12、13、10、11。整理最老seq10后边界可推进为11，新seq14复用下标2。数组下标大小不是年龄，整理不必等同于物理回收。</desc>
  <rect width="1000" height="390" fill="#fff"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#17202a" text-anchor="middle">
    <text x="500" y="31" font-size="22">Seq 决定年龄；slot = seq % 4 只决定存放位置</text>
    <g font-size="17"><text x="185" y="83">slot 0</text><text x="395" y="83">slot 1</text><text x="605" y="83">slot 2</text><text x="815" y="83">slot 3</text></g>
    <g stroke="#64748b"><rect x="90" y="100" width="190" height="66" fill="#dbeafe"/><rect x="300" y="100" width="190" height="66" fill="#dcfce7"/><rect x="510" y="100" width="190" height="66" fill="#fef3c7"/><rect x="720" y="100" width="190" height="66" fill="#dbeafe"/></g>
    <g font-size="21"><text x="185" y="141">seq 12</text><text x="395" y="141">seq 13</text><text x="605" y="141">seq 10</text><text x="815" y="141">seq 11</text></g>
    <text x="500" y="206" font-size="18">初始 min=10，max=13；完成适用最老位置整理后推进</text>
    <g stroke="#64748b"><rect x="90" y="232" width="190" height="66" fill="#dbeafe"/><rect x="300" y="232" width="190" height="66" fill="#dbeafe"/><rect x="510" y="232" width="190" height="66" fill="#dcfce7"/><rect x="720" y="232" width="190" height="66" fill="#fef3c7"/></g>
    <g font-size="21"><text x="185" y="273">seq 12</text><text x="395" y="273">seq 13</text><text x="605" y="273">seq 14</text><text x="815" y="273">seq 11</text></g>
    <text x="500" y="333" font-size="18">新 min=11，max=14；下标2变成最新，而不是永远最老</text>
    <text x="500" y="373" font-size="15" fill="#475569">普通窗口示意；整理可改变候选世代和链表位置而非释放内容，不能swap的匿名窗口另有处理</text>
  </g>
</svg>
