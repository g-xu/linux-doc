<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1170" viewBox="0 0 1100 1170" role="img" aria-labelledby="title desc">
  <title id="title">页分配慢路径的条件与重试</title>
  <desc id="desc">慢路径重新计算标志并尝试，按条件提前规整，重试阶段处理位置变化和保留。不能直接回收则进入退出判断；可以时回收、规整并再次尝试，按进展判断重试或适用 OOM，合法 NOFAIL 有特殊处理。</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52616c"/></marker>
    <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#24323c;font-size:20px}.h{font-size:26px;font-weight:700}.s{font-size:17px;fill:#455561}.n{stroke:#bdcbd3;stroke-width:1.5;rx:6}.e{fill:none;stroke:#52616c;stroke-width:2;marker-end:url(#a)}.d{fill:none;stroke:#8d6674;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#a)}</style>
  </defs>
  <rect width="1100" height="1170" fill="#fff"/>
  <text x="35" y="38" class="h">允许行为先于尝试力度；各次取得页都可以提前完成</text>
  <rect x="40" y="78" width="625" height="100" class="n" fill="#e8f0fa"/>
  <text x="352" y="115" text-anchor="middle">1. 重算 alloc_flags 与候选位置</text>
  <text x="352" y="149" text-anchor="middle" class="s">适用后台唤醒 → 再尝试 get_page_from_freelist()</text>
  <rect x="790" y="78" width="275" height="160" class="n" fill="#e2f2ec"/>
  <text x="927" y="117" text-anchor="middle">任何阶段取得页</text>
  <text x="927" y="154" text-anchor="middle">即可转交成功路径</text>
  <text x="927" y="194" text-anchor="middle" class="s">不强制执行所有步骤</text>
  <path d="M665 128H785" class="e"/>
  <path d="M352 178V237" class="e"/>
  <text x="370" y="217" class="s">尚未取得</text>
  <rect x="40" y="242" width="625" height="105" class="n" fill="#fff1dc"/>
  <text x="352" y="278" text-anchor="middle">2. 按条件提前直接规整</text>
  <text x="352" y="312" text-anchor="middle" class="s">允许相关操作 + costly / 适用非移动高阶等条件</text>
  <text x="790" y="300" class="s">可能基本页够，但缺连续性</text>
  <path d="M352 347V407" class="e"/>
  <text x="370" y="384" class="s">跳过 / 失败，且未满足提前退出条件</text>
  <rect x="40" y="412" width="625" height="105" class="n" fill="#e8f0fa"/>
  <text x="352" y="450" text-anchor="middle">3. retry：更新检查、保留资格与再取页</text>
  <text x="352" y="485" text-anchor="middle" class="s">cpuset / zonelist 变化可触发重新建立上下文</text>
  <path d="M352 517V568" class="e"/>
  <rect x="40" y="573" width="625" height="90" class="n" fill="#fff1dc"/>
  <text x="352" y="608" text-anchor="middle">4. 当前路径允许直接回收？</text>
  <text x="352" y="640" text-anchor="middle" class="s">还需检查防止回收递归等状态</text>
  <path d="M665 618H785" class="e"/>
  <text x="704" y="602" class="s">否</text>
  <rect x="790" y="573" width="275" height="150" class="n" fill="#f8edf0"/>
  <text x="927" y="610" text-anchor="middle">nopage / 退出判断</text>
  <text x="927" y="648" text-anchor="middle" class="s">不继续同步回收等待</text>
  <text x="927" y="688" text-anchor="middle" class="s">也不自动触发 OOM</text>
  <path d="M352 663V723" class="e"/>
  <text x="370" y="703" class="s">允许且适用</text>
  <rect x="40" y="728" width="625" height="108" class="n" fill="#e2f2ec"/>
  <text x="352" y="766" text-anchor="middle">5. 直接回收并再分配 → 适用直接规整并再分配</text>
  <text x="352" y="801" text-anchor="middle" class="s">“有进展”不等于已满足本次请求</text>
  <path d="M352 836V892" class="e"/>
  <rect x="40" y="897" width="625" height="94" class="n" fill="#e8f0fa"/>
  <text x="352" y="933" text-anchor="middle">6. 按标志、成本和进展判断重试</text>
  <text x="352" y="967" text-anchor="middle" class="s">允许重试返回阶段 3；否则继续退出 / OOM 资格判断</text>
  <path d="M40 944H20V464H35" class="d"/>
  <text x="790" y="932" class="s">NORETRY / costly 等可提前退出</text>
  <text x="790" y="969" class="s">图省略这些分支的逐条连线</text>
  <path d="M352 991V1037" class="e"/>
  <rect x="40" y="1042" width="625" height="84" class="n" fill="#f8edf0"/>
  <text x="352" y="1076" text-anchor="middle">7. 适用 OOM、进展检查与失败 / 特殊重试</text>
  <text x="352" y="1110" text-anchor="middle" class="s">合法 NOFAIL 有单独处理；不修复非法上下文与参数</text>
  <text x="790" y="1080" class="s">OOM 不是每次失败的必经步骤</text>
  <text x="35" y="1156" class="s">简化决策图：省略并发更新、受害者、CMA、成本退出与其他特殊分支的完整实现。</text>
</svg>
