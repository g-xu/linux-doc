<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">PCP 的局部复用与批量交接</title>
  <desc id="desc">两个 CPU 为同一 Zone 维护 PCP 缓存。列表不足从 Buddy 批量补充，归还达到策略条件批量回流。本版本普通低阶与部分大页条件可用 PCP，count 以基本页计数。</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52616c"/></marker>
    <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#24323c;font-size:20px}.h{font-size:26px;font-weight:700}.s{font-size:17px;fill:#455561}.n{stroke:#bdcbd3;stroke-width:1.5;rx:6}.e{fill:none;stroke:#52616c;stroke-width:2;marker-end:url(#a)}</style>
  </defs>
  <rect width="1100" height="680" fill="#fff"/>
  <text x="35" y="38" class="h">局部复用快，但空闲块暂存不等于已在 Buddy 合并</text>
  <rect x="35" y="90" width="420" height="146" class="n" fill="#e8f0fa"/>
  <text x="245" y="130" text-anchor="middle">CPU 0 的 PCP</text>
  <text x="245" y="168" text-anchor="middle" class="s">当前 CPU：取块 / 归还 / 列表保护</text>
  <text x="245" y="205" text-anchor="middle" class="s">order-2 块加入 → count 增加 4</text>
  <rect x="645" y="90" width="420" height="146" class="n" fill="#e8f0fa"/>
  <text x="855" y="130" text-anchor="middle">CPU 1 的 PCP</text>
  <text x="855" y="168" text-anchor="middle" class="s">同一 Zone 的其他局部资源</text>
  <text x="855" y="205" text-anchor="middle" class="s">可以被排空，不是永久私人池</text>
  <path d="M140 445V241" class="e"/>
  <path d="M365 241V445" class="e"/>
  <path d="M740 445V241" class="e"/>
  <path d="M965 241V445" class="e"/>
  <text x="160" y="300" class="s">列表不足</text>
  <text x="160" y="334" class="s">批量补充</text>
  <text x="345" y="376" text-anchor="end" class="s">达到策略条件</text>
  <text x="345" y="410" text-anchor="end" class="s">批量回流</text>
  <text x="760" y="300" class="s">列表不足</text>
  <text x="760" y="334" class="s">批量补充</text>
  <text x="945" y="376" text-anchor="end" class="s">达到策略条件</text>
  <text x="945" y="410" text-anchor="end" class="s">批量回流</text>
  <rect x="35" y="450" width="1030" height="104" class="n" fill="#e2f2ec"/>
  <text x="550" y="490" text-anchor="middle">同一 Zone 的 Buddy：共享列表与保护</text>
  <text x="550" y="524" text-anchor="middle" class="s">批量转移降低共享操作频率；回到这里才可参与对应伙伴合并</text>
  <text x="35" y="600" class="s">本地普通 PCP 资格：order ≤ 3；另有透明大页构建条件分支，不承诺每次都命中。</text>
  <text x="35" y="635" class="s">PCP 锁失败、类型或特殊区域不适用时可直接走 Buddy。局部缓存仍须保证 CPU 稳定性与同步。</text>
  <text x="35" y="667" class="s">图省略其他 CPU、释放策略细节和不适用 PCP 的分支。</text>
</svg>
