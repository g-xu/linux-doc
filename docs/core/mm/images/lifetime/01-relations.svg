<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">引用、映射与pin不同责任</title><desc id="desc">文件缓存及mm A/B映射都可持有P，另有普通内核引用或pin。撤一个PTE不结束其他使用，引用有效不保证原VA仍指P，设备停止与适用解映射后才能unpin。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Microsoft YaHei",sans-serif;font-size:18px;fill:#17232b;letter-spacing:0}.h{font-size:23px;font-weight:700}.s{font-size:16px}.b{stroke:#71838b;stroke-width:1.5;rx:5}.ar{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}</style>
<rect width="960" height="450" fill="#fff"/><text x="28" y="40" class="h">一份数据，多种持有；撤映射不自动结束寿命</text>
<rect x="40" y="90" width="250" height="65" fill="#eaf1fb" class="b"/><text x="62" y="131">i_pages缓存持有</text>
<rect x="355" y="90" width="250" height="65" fill="#eaf1fb" class="b"/><text x="377" y="131">mm A / B的实际PTE</text>
<rect x="670" y="90" width="250" height="65" fill="#fff0e7" class="b"/><text x="692" y="131">普通引用 / 合法pin</text>
<path class="ar" d="M165 155V190H390V240"/><path class="ar" d="M480 155V240"/><path class="ar" d="M795 155V190H570V240"/>
<rect x="285" y="240" width="390" height="90" fill="#e6f4ef" class="b"/><text x="307" y="277">P：基本页及其单页folio</text><text x="307" y="311" class="s">refcount、mapcount、pin跟踪不同</text>
<text x="40" y="381">P还活着，不保证原VA仍映射P，也不授予无锁改内容的权限。</text>
<text x="40" y="425" class="s">mlock主要约束驻留；pin释放必须配对并先结束设备访问；计数模型按页类型限定。</text>
</svg>
