<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="520" viewBox="0 0 1060 520" role="img" aria-labelledby="t d">
<title id="t">限定条件下的arm64四级页表遍历</title><desc id="d">仅用于4KiB页、48位VA、四级模型。PGD PUD PMD PTE的索引分别来自47到39、38到30、29到21、20到12位，页内偏移11到0。P4D折叠，没有额外硬件表。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52616c"/></marker><style>text{font:20px "Microsoft YaHei",sans-serif;fill:#24323c}.h{font-size:26px;font-weight:bold}.s{font-size:17px}.e{fill:none;stroke:#52616c;stroke-width:2;marker-end:url(#a)}</style></defs>
<rect width="1060" height="520" fill="white"/><text x="30" y="38" class="h">示例限定：4 KiB基本页 + 48位VA + 四级翻译</text>
<rect x="30" y="85" width="200" height="85" rx="6" fill="#e8f0fa"/><rect x="295" y="85" width="200" height="85" rx="6" fill="#e8f0fa"/><rect x="560" y="85" width="200" height="85" rx="6" fill="#e8f0fa"/><rect x="825" y="85" width="200" height="85" rx="6" fill="#e8f0fa"/>
<text x="130" y="118" text-anchor="middle">L0 / PGD</text><text x="130" y="150" text-anchor="middle" class="s">47:39 · 索引1</text><text x="395" y="118" text-anchor="middle">L1 / PUD</text><text x="395" y="150" text-anchor="middle" class="s">38:30 · 索引2</text><text x="660" y="118" text-anchor="middle">L2 / PMD</text><text x="660" y="150" text-anchor="middle" class="s">29:21 · 索引3</text><text x="925" y="118" text-anchor="middle">L3 / PTE</text><text x="925" y="150" text-anchor="middle" class="s">20:12 · 索引4</text>
<path d="M230 128H290" class="e"/><path d="M495 128H555" class="e"/><path d="M760 128H820" class="e"/><path d="M925 170V257H530V293" class="e"/>
<rect x="30" y="300" width="995" height="90" rx="6" fill="#e2f2ec"/><text x="528" y="339" text-anchor="middle">末级输出页基址 + 页内偏移 0x120 → 物理地址</text><text x="528" y="372" text-anchor="middle" class="s">偏移来自11:0；索引不是PFN，表页也需要后备内存</text>
<text x="30" y="440" class="s">本例P4D折叠，不存在第五张真实表；其他页大小/VA配置、大页和属性需要按实际确认。</text>
<text x="30" y="478" class="s">TLB未命中仍可完成硬件遍历；只有映射、权限或其他检查失败才有对应异常。</text>
</svg>
