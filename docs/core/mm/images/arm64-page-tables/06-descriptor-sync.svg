<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620">
<title>描述符组成与内核范围失效完成边界</title>
<desc>4KiB和普通48位以内PA例子，用户只读Normal页的地址与type、AttrIndx0、AF、SH、nG和权限构成PTE。下部另以只撤内核末级项且父表不变的情形，演示页表存储、末级TLBI、失效完成和本CPU执行同步；不保证中间表walk-cache或软件引用退出。</desc>
<defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#475569"/></marker></defs>
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#24313b;font-size:18px}.h{font-size:23px;font-weight:700}.small{font-size:16px}.box{fill:#f4f7f8;stroke:#8195a3;stroke-width:1.5}.arrow{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#head)}</style>
<rect width="1120" height="620" fill="white"/>
<text x="32" y="40" class="h">一项描述符：地址与属性一起定义转换</text>
<rect x="32" y="68" width="670" height="126" rx="4" class="box"/>
<text x="50" y="98">内存中的末级 PTE</text>
<text x="50" y="132">基址 0x12345000 | type=11 | AttrIndx(0)=Normal</text>
<text x="50" y="164">AF | SH | nG | USER / RDONLY | UXN / PXN</text>
<rect x="808" y="68" width="278" height="126" rx="4" class="box"/>
<text x="826" y="98">TLB 中的适用转换</text>
<text x="826" y="132">VA → PA / 权限 / 属性</text>
<text x="826" y="164" class="small">命中不重读当前 PTE</text>
<path d="M702 132 H808" class="arrow"/>
<text x="710" y="114" class="small">硬件遍历</text>
<text x="32" y="230" class="small">Normal 槽0；SH 是共享属性；nG 连接 ASID 区分；页内偏移来自 VA。</text>
<text x="32" y="282" class="h">撤内核映射：小范围 flush_tlb_kernel_range 例子</text>
<rect x="32" y="314" width="190" height="132" rx="4" class="box"/>
<text x="48" y="344">1. 写无效项</text><text x="48" y="380" class="small">内存记录已改</text><text x="48" y="412" class="small">旧转换可能仍在</text>
<rect x="256" y="314" width="190" height="132" rx="4" class="box"/>
<text x="272" y="344">2. DSB ishst</text><text x="272" y="380" class="small">此前表存储完成</text><text x="272" y="412" class="small">再启动失效</text>
<rect x="480" y="314" width="190" height="132" rx="4" class="box"/>
<text x="496" y="344">3. TLBI</text><text x="496" y="380" class="small">末级 vaale1is</text><text x="496" y="412" class="small">尚须等待完成</text>
<rect x="704" y="314" width="190" height="132" rx="4" class="box"/>
<text x="720" y="344">4. DSB ish</text><text x="720" y="380" class="small">要求的失效完成</text><text x="720" y="412" class="small">结束旧硬件转换</text>
<rect x="928" y="314" width="158" height="132" rx="4" class="box"/>
<text x="944" y="344">5. ISB</text><text x="944" y="380" class="small">本 CPU 后续</text><text x="944" y="412" class="small">执行同步</text>
<path d="M222 366 H256" class="arrow"/><path d="M446 366 H480" class="arrow"/><path d="M670 366 H704" class="arrow"/><path d="M894 366 H928" class="arrow"/>
<text x="32" y="498">失效结束 ≠ 软件引用结束 ≠ 数据持久化 ≠ 页已归还</text>
<text x="32" y="538" class="small">下部仅撤叶项、父表不变；末级失效不保证中间表 walk-cache 已清。</text>
<text x="32" y="578" class="small">本图是选定 helper 的因果模型，不是所有页表更新的通用固定序列。</text>
</svg>
