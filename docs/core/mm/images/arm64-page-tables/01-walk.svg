<svg xmlns="http://www.w3.org/2000/svg" width="940" height="610" viewBox="0 0 940 610" role="img" aria-labelledby="title desc">
  <title id="title">4KiB48位四级页表地址分解</title><desc id="desc">明确配置模型下VA0x8080604120的PGD PUD PMD PTE索引分别1234，偏移0x120。三层表描述连接下级，末级PFN0x12345基址0x12345000，加偏移得到PA0x12345120。PMD block可早停并用低21位偏移。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
  <style>text{font-family:"Microsoft YaHei",sans-serif;font-size:18px;fill:#17232b;letter-spacing:0}.h{font-size:22px;font-weight:700}.s{font-size:16px}.b{stroke:#71838b;stroke-width:1.5;rx:5}.ar{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}</style>
  <rect width="940" height="610" fill="#fff"/><text x="28" y="36" class="h">4KiB / 48位VA / 四级模型，P4D折叠</text><text x="28" y="72">VA = 0x0000008080604120；索引不是数据页 PFN</text>
  <rect x="40" y="108" width="140" height="94" fill="#eef1f4" class="b"/><rect x="180" y="108" width="140" height="94" fill="#eaf1fb" class="b"/><rect x="320" y="108" width="140" height="94" fill="#e6f4ef" class="b"/><rect x="460" y="108" width="140" height="94" fill="#fff0e7" class="b"/><rect x="600" y="108" width="140" height="94" fill="#f9eaf0" class="b"/><rect x="740" y="108" width="160" height="94" fill="#eef1f4" class="b"/>
  <text x="110" y="140" text-anchor="middle" class="s">高位 63:48</text><text x="110" y="180" text-anchor="middle">0</text>
  <text x="250" y="140" text-anchor="middle" class="s">PGD 47:39</text><text x="250" y="180" text-anchor="middle">1</text><text x="390" y="140" text-anchor="middle" class="s">PUD 38:30</text><text x="390" y="180" text-anchor="middle">2</text><text x="530" y="140" text-anchor="middle" class="s">PMD 29:21</text><text x="530" y="180" text-anchor="middle">3</text><text x="670" y="140" text-anchor="middle" class="s">PTE 20:12</text><text x="670" y="180" text-anchor="middle">4</text><text x="820" y="140" text-anchor="middle" class="s">偏移 11:0</text><text x="820" y="180" text-anchor="middle">0x120</text>
  <rect x="30" y="267" width="190" height="95" fill="#eaf1fb" class="b"/><rect x="260" y="267" width="190" height="95" fill="#e6f4ef" class="b"/><rect x="490" y="267" width="190" height="95" fill="#fff0e7" class="b"/><rect x="720" y="267" width="190" height="95" fill="#f9eaf0" class="b"/>
  <text x="125" y="300" text-anchor="middle">PGD 项1</text><text x="125" y="340" text-anchor="middle">取 L1 表地址</text><text x="355" y="300" text-anchor="middle">PUD 项2</text><text x="355" y="340" text-anchor="middle">取 L2 表地址</text><text x="585" y="300" text-anchor="middle">PMD 项3</text><text x="585" y="340" text-anchor="middle">取 L3 表地址</text><text x="815" y="300" text-anchor="middle">PTE 项4</text><text x="815" y="340" text-anchor="middle">PFN 0x12345</text>
  <path class="ar" d="M220 313H260"/><path class="ar" d="M450 313H490"/><path class="ar" d="M680 313H720"/><path class="ar" d="M815 362V414"/>
  <rect x="490" y="414" width="420" height="79" fill="#e6f4ef" class="b"/><text x="700" y="446" text-anchor="middle">0x12345000 + 0x120</text><text x="700" y="478" text-anchor="middle" class="h">PA = 0x12345120</text>
  <text x="28" y="536" class="h">若PMD为合法block：在L2早停，低21位作为块内偏移。</text>
  <text x="28" y="577" class="s">表描述与叶子类型必须先判别；本例参数不代表目标机配置或实际后备地址。</text>
</svg>
