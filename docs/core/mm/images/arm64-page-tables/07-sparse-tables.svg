<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title">
  <title id="title">同一上级表中的相邻区域可按需建立末级表</title>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#425363"/></marker></defs>
  <rect width="640" height="340" rx="8" fill="#f7fafb"/>
  <g stroke-width="1.5">
    <rect x="24" y="20" width="592" height="108" rx="8" fill="#e9f2fa" stroke="#537699"/>
    <rect x="42" y="68" width="174" height="44" rx="4" fill="#fff" stroke="#537699"/>
    <rect x="233" y="68" width="174" height="44" rx="4" fill="#fff" stroke="#537699"/>
    <rect x="424" y="68" width="174" height="44" rx="4" fill="#f7fafb" stroke="#8b98a2" stroke-dasharray="5 3"/>
    <rect x="26" y="197" width="206" height="97" rx="6" fill="#edf5ed" stroke="#508164"/>
    <rect x="239" y="197" width="162" height="97" rx="6" fill="#fff0dc" stroke="#a5763e"/>
  </g>
  <g fill="none" stroke="#425363" stroke-width="2" marker-end="url(#a)">
    <path d="M129 112V192"/><path d="M320 112V192"/>
  </g>
  <g text-anchor="middle" font-family="Microsoft YaHei, sans-serif" fill="#1d2d3b">
    <g font-size="22" font-weight="bold">
      <text x="320" y="53">同一张 PMD 表：每项覆盖 2 MiB</text>
      <text x="129" y="232">同一 PTE 表页</text><text x="320" y="232">另一 PTE 表页</text>
    </g>
    <g font-size="18">
      <text x="129" y="97">PMD 索引 3</text><text x="320" y="97">PMD 索引 4</text><text x="511" y="97">PMD 索引 5</text>
      <text x="129" y="266">PTE 索引 4、5</text><text x="320" y="266">需要时再建立</text>
      <text x="511" y="165">此项为空，无下级表</text>
      <text x="320" y="324">箭头表示表描述符的指向，不是数据页之间的关系</text>
    </g>
  </g>
</svg>
