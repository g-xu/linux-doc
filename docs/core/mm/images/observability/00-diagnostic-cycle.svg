<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
<title id="title">从内存现象到有限诊断结论</title>
<desc id="desc">给定静态模型：高阶申请失败但全局仍有空闲。先固定请求与范围，选择相匹配已有证据，提出供给或资格等候选机制，核对条件与路径时序，再区分已确认结论和未知项。箭头是诊断顺序，不是内核调用链；观测不自动授权主动回收、启用跟踪或实验。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Microsoft YaHei",sans-serif;font-size:18px;fill:#17232b;letter-spacing:0}.h{font-size:23px;font-weight:700}.s{font-size:16px}.b{stroke:#71838b;stroke-width:1.5;rx:5}.ar{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}</style>
<rect width="960" height="550" fill="#fff"/>
<text x="28" y="40" class="h">申请失败，但全局有空闲：先核对哪个机制问题？</text>
<text x="28" y="75" class="s">教学静态材料，不是目标机测量；不能从总空闲数直接得到根因。</text>
<rect x="40" y="105" width="260" height="105" class="b" fill="#eaf1fb"/><text x="62" y="141">1 固定请求口径</text><text x="62" y="173" class="s">任务/时间/order/GFP</text><text x="62" y="198" class="s">节点、zone与收费范围</text>
<rect x="350" y="105" width="260" height="105" class="b" fill="#e6f4ef"/><text x="372" y="141">2 选匹配的已有证据</text><text x="372" y="173" class="s">块/类型/水位、组事件</text><text x="372" y="198" class="s">计数区间、停顿与覆盖</text>
<rect x="660" y="105" width="260" height="105" class="b" fill="#fff0e7"/><text x="682" y="141">3 提出候选机制</text><text x="682" y="173" class="s">容量、连续性、资格</text><text x="682" y="198" class="s">组额度、等待或持有</text>
<path class="ar" d="M300 157H350"/><path class="ar" d="M610 157H660"/><path class="ar" d="M790 210V330"/>
<text x="40" y="270">箭头是诊断顺序，不是内核调用链。</text>
<text x="40" y="302" class="s">缺项不补0；同时增长不是因果；既有计数不自动对应某一次申请。</text>
<rect x="660" y="330" width="260" height="105" class="b" fill="#eaf1fb"/><text x="682" y="366">4 核对分支条件</text><text x="682" y="398" class="s">哪些条件实际满足？</text><text x="682" y="423" class="s">哪些仍只是候选解释？</text>
<rect x="350" y="330" width="260" height="105" class="b" fill="#e6f4ef"/><text x="372" y="366">5 对照源码与路径</text><text x="372" y="398" class="s">验证记录语义与时序</text><text x="372" y="423" class="s">没有覆盖就保留未知</text>
<rect x="40" y="330" width="260" height="105" class="b" fill="#f9eaf0"/><text x="62" y="366">6 输出有限结论</text><text x="62" y="398" class="s">已确认状态、证据边界</text><text x="62" y="423" class="s">待核项及下一条证据</text>
<path class="ar" d="M660 382H610"/><path class="ar" d="M350 382H300"/>
<text x="40" y="481">观测不自动授权启用检测、清缓存、规整或压力实验。</text>
<text x="40" y="523" class="s">状态、累计变化、停顿、对象来源与采样互补，但不是同一个账本。</text>
</svg>
