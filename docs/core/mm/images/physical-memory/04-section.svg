<svg xmlns="http://www.w3.org/2000/svg" width="920" height="425" viewBox="0 0 920 425" role="img" aria-labelledby="title desc">
  <title id="title">section 分组与 RAM、空洞不同</title><desc id="desc">教学模型每section16个PFN，第二section16到32含16到24空洞及24到32 RAM。early section有效可使空洞PFN20通过pfn_valid，不能因此交付。</desc>
  <style>text{font-family:"Microsoft YaHei",sans-serif;font-size:18px;fill:#17232b;letter-spacing:0}.h{font-size:22px;font-weight:700}.s{font-size:16px}.b{stroke:#71838b;stroke-width:1.5}</style>
  <rect width="920" height="425" fill="#fff"/><text x="28" y="36" class="h">section 是描述分组，不是 RAM 连续区间</text><text x="28" y="71" class="s">仅为缩小模型：16 PFN 一组。真实大小按 SECTION_SIZE_BITS / PAGE_SHIFT 确认。</text>
  <rect x="50" y="108" width="400" height="59" fill="#eaf1fb" class="b"/><rect x="450" y="108" width="400" height="59" fill="#fff0e7" class="b"/>
  <text x="250" y="145" text-anchor="middle">section 0：[0,16)</text><text x="650" y="145" text-anchor="middle">section 1：[16,32)</text>
  <rect x="50" y="199" width="400" height="62" fill="#e6f4ef" class="b"/><rect x="100" y="199" width="50" height="62" fill="#f9eaf0" class="b"/>
  <rect x="450" y="199" width="200" height="62" fill="#eef1f4" class="b"/><rect x="650" y="199" width="200" height="62" fill="#e6f4ef" class="b"/><rect x="700" y="199" width="25" height="62" fill="#f9eaf0" class="b"/>
  <text x="285" y="237" text-anchor="middle">RAM</text><text x="550" y="237" text-anchor="middle">空洞：含 PFN20</text><text x="790" y="237" text-anchor="middle">RAM</text>
  <text x="50" y="293">0</text><text x="443" y="293">16</text><text x="642" y="293">24</text><text x="843" y="293">32</text>
  <text x="28" y="338" class="h">early section 有效，不证明该组每一个 PFN 是可用 RAM。</text>
  <text x="28" y="376" class="s">PFN20 可有描述资格却在物理空洞；PFN26 属于 RAM 却仍在 reserved。</text>
  <text x="28" y="409" class="s">描述索引、实际范围、Node / Zone 归属及供给状态需要分别判断。</text>
</svg>
