<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="710" viewBox="0 0 1040 710" role="img" aria-labelledby="title desc">
  <title id="title">从接受 RAM 范围到首次交接的最小过程</title>
  <desc id="desc">用PFN页号表示两个接受范围0到16与24到32，共24页，中间16到24不是RAM。固定占用2到4与26到27使候选21页；早期取得4到6，管理后备取得6到7，使候选18页。在全部描述与状态就绪、无额外筛选和延后初始化的模型里，余页交给运行期分配器，保留页继续由原所有者使用。颜色改变表示占用和管理资格，不搬移RAM；一页管理占用是教学简化。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#48565e"/>
    </marker>
  </defs>
  <style>
    text{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:18px;fill:#243038;letter-spacing:0}
    .heading{font-size:24px;font-weight:700}.label{font-size:20px;font-weight:700}.small{font-size:16px}
    .cell{stroke:#78828b;stroke-width:1.3}.flow{fill:none;stroke:#48565e;stroke-width:2;marker-end:url(#arrow)}
  </style>
  <rect width="1040" height="710" fill="#fff"/>
  <text x="30" y="43" class="heading">RAM 位置不变；逐步登记占用、建立管理，再交接余页</text>
  <text x="30" y="80">页号仅为教学模型；单 Node / Zone，无额外筛选，相关初始化全部成功</text>
  <text x="173" y="132" class="label">接受 RAM：[0,16)</text>
  <text x="576" y="132" class="label">空洞</text>
  <text x="765" y="132" class="label">RAM：[24,32)</text>
  <text x="166" y="165" class="small">0</text>
  <text x="550" y="165" class="small">16</text>
  <text x="742" y="165" class="small">24</text>
  <text x="934" y="165" class="small">32</text>
  <text x="30" y="203" class="label">接受范围</text>
  <text x="30" y="234" class="small">24 页 RAM</text>
  <g class="cell">
    <rect x="174" y="180" width="384" height="58" fill="#e9f0fa"/>
    <rect x="558" y="180" width="192" height="58" fill="#eef1f4"/>
    <rect x="750" y="180" width="192" height="58" fill="#e9f0fa"/>
  </g>
  <text x="595" y="217">不在 RAM 中</text>
  <path d="M110 246 V284" class="flow"/>
  <text x="30" y="314" class="label">固定保留</text>
  <text x="30" y="344" class="small">21 页候选</text>
  <g class="cell">
    <rect x="174" y="291" width="384" height="58" fill="#e9f0fa"/>
    <rect x="558" y="291" width="192" height="58" fill="#eef1f4"/>
    <rect x="750" y="291" width="192" height="58" fill="#e9f0fa"/>
    <rect x="222" y="291" width="48" height="58" fill="#f7dce5"/>
    <rect x="798" y="291" width="24" height="58" fill="#f7dce5"/>
  </g>
  <text x="355" y="325">固定占用：3 页</text>
  <path d="M110 357 V395" class="flow"/>
  <text x="30" y="425" class="label">新增占用</text>
  <text x="30" y="455" class="small">18 页候选</text>
  <g class="cell">
    <rect x="174" y="402" width="384" height="58" fill="#e9f0fa"/>
    <rect x="558" y="402" width="192" height="58" fill="#eef1f4"/>
    <rect x="750" y="402" width="192" height="58" fill="#e9f0fa"/>
    <rect x="222" y="402" width="48" height="58" fill="#f7dce5"/>
    <rect x="270" y="402" width="48" height="58" fill="#ffe5a4"/>
    <rect x="318" y="402" width="24" height="58" fill="#c4d5ee"/>
    <rect x="798" y="402" width="24" height="58" fill="#f7dce5"/>
  </g>
  <text x="370" y="436">再占用 3 页</text>
  <path d="M110 468 V506" class="flow"/>
  <text x="30" y="536" class="label">状态就绪</text>
  <text x="30" y="566" class="small">交接 18 页</text>
  <g class="cell">
    <rect x="174" y="513" width="384" height="58" fill="#d6eddf"/>
    <rect x="558" y="513" width="192" height="58" fill="#eef1f4"/>
    <rect x="750" y="513" width="192" height="58" fill="#d6eddf"/>
    <rect x="222" y="513" width="48" height="58" fill="#f7dce5"/>
    <rect x="270" y="513" width="48" height="58" fill="#ffe5a4"/>
    <rect x="318" y="513" width="24" height="58" fill="#c4d5ee"/>
    <rect x="798" y="513" width="24" height="58" fill="#f7dce5"/>
  </g>
  <text x="350" y="547">合格余页交给分配器</text>
  <rect x="30" y="608" width="18" height="18" fill="#f7dce5" class="cell"/>
  <text x="57" y="624" class="small">固定占用 3 页</text>
  <rect x="247" y="608" width="18" height="18" fill="#ffe5a4" class="cell"/>
  <text x="274" y="624" class="small">早期资源 2 页</text>
  <rect x="464" y="608" width="18" height="18" fill="#c4d5ee" class="cell"/>
  <text x="491" y="624" class="small">管理后备 1 页</text>
  <rect x="681" y="608" width="18" height="18" fill="#d6eddf" class="cell"/>
  <text x="708" y="624" class="small">已完成普通交接</text>
  <text x="30" y="665" class="small">蓝色候选不代表已在空闲列表；箭头是阶段推进，不是搬移数据。其他启动开销省略。</text>
  <text x="30" y="693" class="small">管理后备恰占一页只是教学假设；描述、归属、页状态和交接的实现分别在后文展开。</text>
</svg>
