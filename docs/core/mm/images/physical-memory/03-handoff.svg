<svg xmlns="http://www.w3.org/2000/svg" width="940" height="630" viewBox="0 0 940 630" role="img" aria-labelledby="title desc">
  <title id="title">保留页与候选页的首次移交</title><desc id="desc">常规描述初始化引用为1。保留PFN2被范围筛选排除，继续由原所有者管理。适用PFN8通过核心移交清Reserved和引用，增加managed并绕过PCP进入Buddy。本地arm64无KMSAN接管；延后初始化另按配置条件处理。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
  <style>text{font-family:"Microsoft YaHei",sans-serif;font-size:18px;fill:#17232b;letter-spacing:0}.h{font-size:22px;font-weight:700}.s{font-size:16px}.b{stroke:#71838b;stroke-width:1.5;rx:5}.ar{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}</style>
  <rect width="940" height="630" fill="#fff"/><text x="28" y="36" class="h">有描述符还不够：移交同时改变引用、资格与供给组织</text>
  <rect x="35" y="85" width="390" height="108" fill="#f9eaf0" class="b"/><text x="57" y="120" class="h">PFN 2：保留页</text><text x="57" y="158">已初始化，引用 1，保留处理标记</text>
  <rect x="515" y="85" width="390" height="108" fill="#eaf1fb" class="b"/><text x="537" y="120" class="h">PFN 8：普通候选</text><text x="537" y="158">已初始化，引用 1，尚不在 Buddy</text>
  <path class="ar" d="M230 193V244"/><path class="ar" d="M710 193V244"/>
  <rect x="35" y="244" width="390" height="108" fill="#f9eaf0" class="b"/><text x="57" y="279" class="h">reserved 排除本轮供给</text><text x="57" y="317">不作为普通 free 范围移交</text>
  <rect x="515" y="244" width="390" height="135" fill="#e6f4ef" class="b"/><text x="537" y="279" class="h">__free_pages_core()</text><text x="537" y="317">清 Reserved、涉及页引用 → 0</text><text x="537" y="355">managed 增加，绕过 PCP</text>
  <path class="ar" d="M230 352V430"/><path class="ar" d="M710 379V430"/>
  <rect x="35" y="430" width="390" height="108" fill="#f9eaf0" class="b"/><text x="57" y="464" class="h">原所有者继续决定寿命</text><text x="57" y="502">结束占用后走对应释放路径</text>
  <rect x="515" y="430" width="390" height="108" fill="#e6f4ef" class="b"/><text x="537" y="464" class="h">成为管理内空闲块</text><text x="537" y="502">Buddy 块头记录，不逐页重复登记</text>
  <text x="28" y="582" class="s">普通已初始化模型；本地 arm64 无 KMSAN 接管，延后初始化另按条件处理。</text>
  <text x="28" y="616" class="s">初始化资格转换不是业务代码手动清标记并释放任意 PFN 的许可。</text>
</svg>
