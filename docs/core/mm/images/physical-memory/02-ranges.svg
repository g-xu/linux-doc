<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">接受范围、保留和早期申请</title><desc id="desc">memory为0到16和24到32，空洞16到24。reserved为2到4和26到27，候选21页。早期申请4到6新增保留，候选19页；下一申请6到8，不能重复交付。</desc>
  <style>text{font-family:"Microsoft YaHei",sans-serif;font-size:18px;fill:#17232b;letter-spacing:0}.h{font-size:22px;font-weight:700}.s{font-size:16px}.b{stroke:#71838b;stroke-width:1.5}</style>
  <rect width="960" height="500" fill="#fff"/><text x="28" y="36" class="h">同一 RAM 范围：保留改变资格，不删除物理存储</text><text x="28" y="70" class="s">PFN 半开区间；每页 25 像素。模型忽略额外元数据、NOMAP 和其他筛选。</text>
  <text x="35" y="119" class="h">初始：24 页接受，3 页保留，21 页候选</text>
  <rect x="50" y="145" width="400" height="64" fill="#e6f4ef" class="b"/><rect x="100" y="145" width="50" height="64" fill="#f9eaf0" class="b"/>
  <rect x="450" y="145" width="200" height="64" fill="#eef1f4" class="b"/><rect x="650" y="145" width="200" height="64" fill="#e6f4ef" class="b"/><rect x="700" y="145" width="25" height="64" fill="#f9eaf0" class="b"/>
  <text x="245" y="184" text-anchor="middle">memory</text><text x="550" y="184" text-anchor="middle">物理空洞</text><text x="791" y="184" text-anchor="middle">memory</text>
  <text x="50" y="239">0</text><text x="94" y="239">2</text><text x="145" y="239">4</text><text x="443" y="239">16</text><text x="642" y="239">24</text><text x="695" y="239" class="s">26</text><text x="720" y="239" class="s">27</text><text x="843" y="239">32</text>
  <text x="35" y="289" class="h">申请 [4,6) 成功：reserved 更新，候选 21 → 19</text>
  <rect x="50" y="315" width="400" height="64" fill="#e6f4ef" class="b"/><rect x="100" y="315" width="100" height="64" fill="#f9eaf0" class="b"/>
  <rect x="450" y="315" width="200" height="64" fill="#eef1f4" class="b"/><rect x="650" y="315" width="200" height="64" fill="#e6f4ef" class="b"/><rect x="700" y="315" width="25" height="64" fill="#f9eaf0" class="b"/>
  <text x="150" y="354" text-anchor="middle">[2,6) 保留</text><text x="325" y="354" text-anchor="middle">候选</text><text x="550" y="354" text-anchor="middle">空洞不变</text><text x="791" y="354" text-anchor="middle">候选</text>
  <text x="50" y="409">0</text><text x="94" y="409">2</text><text x="193" y="409">6</text><text x="443" y="409">16</text><text x="642" y="409">24</text><text x="843" y="409">32</text>
  <text x="28" y="456" class="s">绿色：接受范围中未排除部分；粉色：保留；灰色：不在 memory 的空洞。</text>
  <text x="28" y="487" class="s">下一次同条件 bottom-up 两页申请从 [6,8) 继续，不能再次取得 [4,6)。</text>
</svg>
