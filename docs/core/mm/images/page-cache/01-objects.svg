<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">同文件偏移的共同页缓存</title><desc id="desc">mapping是inode关联的实际address_space缓存管理对象，不是进程mm或一条VA转换。i_pages按索引指向F，共享及尚未COW的私有PTE映射F，read复制到U，私有写取得Q。箭头区分缓存索引、用户转换和复制。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Microsoft YaHei",sans-serif;font-size:18px;fill:#17232b;letter-spacing:0}.h{font-size:23px;font-weight:700}.s{font-size:16px}.b{stroke:#71838b;stroke-width:1.5;rx:5}.ar{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}</style>
<rect width="960" height="560" fill="#fff"/><text x="28" y="40" class="h">缓存按文件位置组织，不按进程VA各复制一套</text>
<rect x="40" y="90" width="360" height="90" fill="#eaf1fb" class="b"/><text x="62" y="126">address_space（mapping）</text><text x="62" y="160">inode关联；i_pages按索引1查找</text>
<path class="ar" d="M400 135H560"/><text x="443" y="118" class="s">索引</text>
<rect x="560" y="90" width="360" height="90" fill="#e6f4ef" class="b"/><text x="582" y="126">缓存folio F：内容及管理状态</text><text x="582" y="160">引用 ≠ 就绪 ≠ 当前归属</text>
<rect x="40" y="282" width="260" height="90" fill="#eaf1fb" class="b"/><text x="60" y="320">共享mmap的PTE</text><text x="60" y="354" class="s">用户访问同一F</text>
<rect x="350" y="282" width="260" height="90" fill="#fff0e7" class="b"/><text x="370" y="320">私有mmap的PTE</text><text x="370" y="354" class="s">写前可F，写后匿名Q</text>
<rect x="660" y="282" width="260" height="90" fill="#f1eef7" class="b"/><text x="680" y="320">read用户缓冲U</text><text x="680" y="354" class="s">复制出的独立用户数据</text>
<path class="ar" d="M170 282V226H660V180"/><path class="ar" d="M480 282V248H735V180"/><path class="ar" d="M830 180V282"/>
<text x="193" y="217" class="s">映射</text><text x="503" y="270" class="s">写前映射</text><text x="843" y="230" class="s">复制</text>
<path class="ar" d="M480 372V425"/>
<rect x="350" y="425" width="260" height="70" fill="#fff0e7" class="b"/><text x="370" y="468">私有写 → 匿名Q</text>
<text x="28" y="539" class="s">修改U或Q不等同写文件F；munmap不必删除缓存；DAX/直接I/O不套用此图。</text>
</svg>
