<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
<title id="title">共享映射脏状态与两轮回写</title><desc id="desc">folio锁下mkclean共享PTE、清dirty、开始writeback。允许并发修改时产生v2和dirty/writeback均1，旧完成不清新dirty。AS_STABLE_WRITES成立时来源等旧回写再允许内容修改；代表page_mkwrite可先mark_dirty，故标志均1不证明v2已写。标志和tags有交接暂态。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Microsoft YaHei",sans-serif;font-size:18px;fill:#17232b;letter-spacing:0}.h{font-size:23px;font-weight:700}.s{font-size:16px}.b{stroke:#71838b;stroke-width:1.5;rx:5}.ar{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}</style>
<rect width="960" height="590" fill="#fff"/><text x="28" y="40" class="h">结束旧回写不清掉新修改；清dirty先协调共享PTE</text>
<rect x="40" y="90" width="880" height="80" fill="#eaf1fb" class="b"/><text x="62" y="124">folio锁下：mkclean共享映射 → 写保护PTE / 捕获脏 → 清本轮dirty</text><text x="62" y="156" class="s">XArray dirty tag可在准备暂态保留，提交或redirty再协调</text>
<rect x="40" y="210" width="390" height="85" fill="#fff0e7" class="b"/><text x="62" y="247">F含v1：dirty=1 / writeback=0</text><text x="62" y="279" class="s">v1需要交给文件系统保存</text>
<rect x="530" y="210" width="390" height="85" fill="#e6f4ef" class="b"/><text x="552" y="247">开始本轮：dirty=0 / writeback=1</text><text x="552" y="279" class="s">本轮传输在途，不表示成功</text>
<path class="ar" d="M430 252H530"/><path class="ar" d="M725 295V340"/>
<rect x="530" y="340" width="390" height="85" fill="#fff0e7" class="b"/><text x="552" y="377">再次修改：dirty=1 / writeback=1</text><text x="552" y="409" class="s">共享写协议捕获v2，需后续保存</text>
<path class="ar" d="M530 382H430"/>
<rect x="40" y="340" width="390" height="85" fill="#f1eef7" class="b"/><text x="62" y="377">旧轮结束：dirty=1 / writeback=0</text><text x="62" y="409" class="s">保留新dirty；等待下一轮处理</text>
<text x="40" y="476">稳定写先等旧轮再改内容；先记dirty可出现(1,1)，未必已写v2。</text>
<text x="40" y="518">真实I/O失败可记mapping错误并结束writeback，不保证自动redirty。</text>
<text x="40" y="558" class="s">这里是稳定阶段模型，不是磁盘精确版本图，也不是所有标志同时原子更新。</text>
</svg>
