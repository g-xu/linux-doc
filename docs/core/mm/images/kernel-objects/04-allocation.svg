<svg xmlns="http://www.w3.org/2000/svg" width="920" height="850" viewBox="0 0 920 850" role="img" aria-labelledby="title desc">
  <title id="title">SLUB 普通分配的供给决策</title>
  <desc id="desc">先处理 pre-hook 与检测。普通路径检查当前 slab 的局部供给及资格，随后共享归还、CPU partial、节点 partial，再申请新 slab 的优先或最小后备。取得槽位后经 post-hook 交付。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
  <style>text{font-family:"Microsoft YaHei",sans-serif;font-size:18px;fill:#17232b;letter-spacing:0}.h{font-size:22px;font-weight:700}.s{font-size:16px}.b{stroke:#70818c;stroke-width:1.5;rx:6}.ar{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}</style>
  <rect width="920" height="850" fill="#fff"/>
  <text x="28" y="37" class="h">普通非调试主干：局部用尽不等于供给用尽</text>
  <rect x="55" y="70" width="470" height="65" fill="#eef1f4" class="b"/>
  <text x="290" y="110" text-anchor="middle">pre-hook / 检测分支</text>
  <rect x="673" y="70" width="202" height="65" fill="#f9eaf0" class="b"/><text x="774" y="110" text-anchor="middle">失败：返回 NULL</text>
  <path class="ar" d="M525 102H673"/><text x="557" y="90" class="s">前置拒绝</text>
  <path class="ar" d="M290 135V175"/>
  <rect x="55" y="175" width="470" height="78" fill="#e6f4ef" class="b"/>
  <text x="290" y="207" text-anchor="middle">当前 slab 与请求匹配，本地链有槽位？</text><text x="290" y="235" text-anchor="middle" class="s">RT / 慢路径按实际保护重新检查</text>
  <path class="ar" d="M525 215H625V720"/><text x="548" y="204" class="s">是，取槽位</text>
  <path class="ar" d="M290 253V298"/><text x="305" y="282" class="s">无供给或不适用</text>
  <rect x="55" y="298" width="470" height="78" fill="#fff0e7" class="b"/>
  <text x="290" y="330" text-anchor="middle">合适的当前 slab：取回共享归还链</text><text x="290" y="358" text-anchor="middle" class="s">不合适则停用；共享也空则解除当前管理</text>
  <path class="ar" d="M525 337H625"/><text x="548" y="326" class="s">取得槽位</text>
  <path class="ar" d="M290 376V418"/><text x="305" y="403" class="s">仍无供给</text>
  <rect x="55" y="418" width="470" height="66" fill="#e6f4ef" class="b"/>
  <text x="290" y="458" text-anchor="middle">可选 CPU partial：接管并检查待激活 slab</text>
  <path class="ar" d="M525 451H625"/><text x="548" y="440" class="s">取得槽位</text>
  <path class="ar" d="M290 484V523"/>
  <rect x="55" y="523" width="470" height="66" fill="#eaf1fb" class="b"/>
  <text x="290" y="562" text-anchor="middle">节点 partial：列表协调 + 冻结 / 取链</text>
  <path class="ar" d="M525 556H625"/><text x="548" y="545" class="s">取得槽位</text>
  <path class="ar" d="M290 589V628"/>
  <rect x="55" y="628" width="470" height="84" fill="#eef1f4" class="b"/>
  <text x="290" y="660" text-anchor="middle">新 slab：优先 oo 后备 → 失败再试 min</text><text x="290" y="692" text-anchor="middle" class="s">建立槽位；装载或停用剩余供给后交付</text>
  <path class="ar" d="M525 670H625"/><text x="548" y="659" class="s">取得槽位</text>
  <rect x="673" y="628" width="202" height="84" fill="#f9eaf0" class="b"/>
  <text x="774" y="662" text-anchor="middle">最小后备也失败</text><text x="774" y="693" text-anchor="middle">返回 NULL</text>
  <path class="ar" d="M525 703H645V698H673"/>
  <rect x="410" y="749" width="435" height="65" fill="#e6f4ef" class="b"/>
  <text x="628" y="790" text-anchor="middle">post-hook：清零 / 检测 / 记账交接 → 交付</text>
  <path class="ar" d="M625 720V749"/>
  <text x="28" y="838" class="s">检查依阶段执行；新 slab 保留资格不匹配仍返回首对象，见正文 4.2。</text>
</svg>
