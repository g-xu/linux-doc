<svg xmlns="http://www.w3.org/2000/svg" width="640" height="416" viewBox="0 0 640 416" role="img" aria-labelledby="title">
  <title id="title">SLUB 的启动依赖顺序</title>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#425363"/></marker></defs>
  <rect width="640" height="416" rx="8" fill="#f7fafb"/>
  <g stroke-width="1.5">
    <rect x="32" y="24" width="576" height="68" rx="6" fill="#e9f2fa" stroke="#537699"/>
    <rect x="32" y="124" width="576" height="68" rx="6" fill="#edf5ed" stroke="#508164"/>
    <rect x="32" y="224" width="576" height="68" rx="6" fill="#edf5ed" stroke="#508164"/>
    <rect x="32" y="324" width="576" height="68" rx="6" fill="#fff0dc" stroke="#a5763e"/>
  </g>
  <g fill="none" stroke="#425363" stroke-width="2" marker-end="url(#a)">
    <path d="M320 95V120"/><path d="M320 195V220"/><path d="M320 295V320"/>
  </g>
  <g text-anchor="middle" font-family="Microsoft YaHei, sans-serif" fill="#1d2d3b">
    <g font-size="22" font-weight="bold">
      <text x="320" y="53">1. 静态描述 + 页分配器供给</text>
      <text x="320" y="153">2. 建立 kmem_cache cache</text>
      <text x="320" y="253">3. 换成正式 cache 描述</text>
      <text x="320" y="353">4. 建立普通 kmalloc 大小类</text>
    </g>
    <g font-size="18">
      <text x="320" y="79">从早期 slab 取出 kmem_cache_node 对象</text>
      <text x="320" y="179">在节点对象可供应、进入 PARTIAL 之后</text>
      <text x="320" y="279">复制描述、刷出 CPU slab、修正已有 slab 回指</text>
      <text x="320" y="379">此时才有通用对象分配的大小类入口</text>
    </g>
  </g>
</svg>
