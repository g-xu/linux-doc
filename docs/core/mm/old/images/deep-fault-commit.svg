<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">匿名缺页的候选准备与锁内提交</title>
  <desc id="desc">两个线程先观察同一个空PTE，分别准备候选页A和B。线程A取得PTE锁后安装A；线程B锁内重查发现条目变化，释放未安装的B。COW复制也必须在准备新页后重新检查原PTE。</desc>
  <rect width="1000" height="430" fill="#fff"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#17202a" text-anchor="middle">
    <text x="500" y="32" font-size="23">锁外准备允许竞争；锁内重查决定谁可以提交</text>
    <g font-size="19"><text x="138" y="80">当前 PTE</text><text x="431" y="80">线程 A</text><text x="779" y="80">线程 B</text></g>
    <g fill="#f1f5f9" stroke="#94a3b8"><rect x="28" y="98" width="220" height="50"/><rect x="278" y="98" width="306" height="50"/><rect x="626" y="98" width="306" height="50"/></g>
    <g font-size="18"><text x="138" y="129">空</text><text x="431" y="129">观察为空</text><text x="779" y="129">观察为空</text></g>
    <g fill="#fef3c7" stroke="#b45309"><rect x="278" y="164" width="306" height="50"/><rect x="626" y="164" width="306" height="50"/></g>
    <g font-size="18"><text x="138" y="195">仍未承诺安装</text><text x="431" y="195">准备候选页 A / charge</text><text x="779" y="195">准备候选页 B / charge</text></g>
    <rect x="28" y="230" width="220" height="50" fill="#dbeafe" stroke="#2563eb"/><rect x="278" y="230" width="306" height="50" fill="#dcfce7" stroke="#15803d"/>
    <g font-size="18"><text x="138" y="261">指向 A</text><text x="431" y="261">锁内重查并安装 A</text><text x="779" y="261">B 尚未提交</text></g>
    <rect x="626" y="296" width="306" height="50" fill="#fee2e2" stroke="#b91c1c"/>
    <g font-size="18"><text x="138" y="327">保持指向 A</text><text x="779" y="327">发现变化，释放候选 B</text></g>
    <text x="500" y="381" font-size="17">COW 复制：锁外准备新内容 → 锁内 pte_same → 按协议清旧、同步并安装新映射</text>
    <text x="500" y="414" font-size="15" fill="#475569">同 mm、同空 PTE 的简化竞争；候选取得不等于映射成功，其他 fault 分支有独立条件</text>
  </g>
</svg>
