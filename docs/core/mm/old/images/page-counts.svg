<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">地址跨度、存在量、管理量与空闲状态</title>
  <desc id="desc">spanned 包含空洞，present 排除空洞，managed 是运行期管理范围。managed 内既有占用页也有空闲页。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#475569"/></marker></defs>
  <rect width="960" height="430" fill="#fff"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#17202a" text-anchor="middle">
    <rect x="260" y="20" width="440" height="60" rx="4" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="480" y="45" font-size="20">spanned_pages：地址跨度</text><text x="480" y="68" font-size="16">包括范围内的 RAM 空洞</text>
    <path d="M480 80V119" stroke="#475569" marker-end="url(#a)"/>
    <text x="660" y="106" font-size="15">区分空洞</text>
    <rect x="260" y="132" width="440" height="60" rx="4" fill="#fef3c7" stroke="#b45309"/>
    <text x="480" y="157" font-size="20">present_pages：实际存在</text><text x="480" y="180" font-size="16">不等于当前空闲</text>
    <path d="M480 192V231" stroke="#475569" marker-end="url(#a)"/>
    <text x="673" y="217" font-size="15">区分未纳入管理的部分</text>
    <rect x="260" y="244" width="440" height="60" rx="4" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="480" y="269" font-size="20">managed_pages：运行期管理</text><text x="480" y="292" font-size="16">分配出去的页通常仍在这个范围内</text>
    <path d="M480 304V326H250V352M480 326H710V352" stroke="#475569" fill="none" marker-end="url(#a)"/>
    <rect x="110" y="364" width="280" height="48" rx="4" fill="#f3f4f6" stroke="#6b7280"/>
    <rect x="570" y="364" width="280" height="48" rx="4" fill="#dcfce7" stroke="#15803d"/>
    <text x="250" y="394" font-size="19">当前占用</text><text x="710" y="394" font-size="19">当前空闲供给</text>
  </g>
</svg>
