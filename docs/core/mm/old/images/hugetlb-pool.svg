<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">HugeTLB空闲量与预留消费</title>
  <desc id="desc">原Free六Reserved四，差值二。从原状态无预留申请一页，Free五Reserved四差一；独立有预留分支取一页，Free五Reserved三差二。后者适用错误恢复把Free和Reserved恢复到六和四。</desc>
  <rect width="1000" height="340" fill="#fff"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#17202a" text-anchor="middle">
    <text x="500" y="31" font-size="22">预留是账本，不是固定指派到某个PFN的映射</text>
    <rect x="28" y="86" width="288" height="116" rx="4" fill="#f1f5f9" stroke="#64748b"/><rect x="356" y="86" width="288" height="116" rx="4" fill="#dbeafe" stroke="#2563eb"/><rect x="684" y="86" width="288" height="116" rx="4" fill="#fef3c7" stroke="#b45309"/>
    <g font-size="19"><text x="172" y="119">原始池</text><text x="500" y="119">无预留者取一张</text><text x="828" y="119">有预留者取一张</text></g>
    <g font-size="18"><text x="172" y="152">Free=6，Reserved=4</text><text x="500" y="152">Free=5，Reserved=4</text><text x="828" y="152">Free=5，Reserved=3</text><text x="172" y="183">差值=2</text><text x="500" y="183">差值=1</text><text x="828" y="183">差值=2</text></g>
    <text x="500" y="253" font-size="18">适用预留分支在完成前失败：归还物理页，并恢复被消费的预留</text>
    <text x="500" y="311" font-size="15" fill="#475569">后两框是从原状态出发的独立分支；节点、子池、组限制与最终预留生命周期另需核对</text>
  </g>
</svg>
